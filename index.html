
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق چكليته الذكي</title>
    <style>
        /* إعادة الواجهة البرتقالية الأصلية */
        body { 
            background-color: #FF8C00; 
            color: white; 
            text-align: center; 
            font-family: Arial, sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            height: 100vh; 
        }
        .icon-box { font-size: 100px; margin-bottom: 20px; }
        h1 { font-size: 30px; margin-bottom: 10px; }
        .gps-button { 
            background-color: #28a745; /* المربع الأخضر */
            color: white; 
            border: none; 
            padding: 20px 40px; 
            font-size: 20px; 
            border-radius: 15px; 
            cursor: pointer; 
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        #status-msg { margin-top: 20px; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="icon-box">🇮🇶</div>
    <h1>مرحباً بكم في چكليته</h1>
    <p>منصة التسوق الذكي في العراق</p>

    <button class="gps-button" onclick="activateGps()">تفعيل خاصية الجي بي اس 🛰️</button>

    <div id="status-msg">اضغط للتفعيل</div>

    <script>
        function activateGps() {
            var status = document.getElementById('status-msg');
            status.innerHTML = "جاري الاتصال بالأقمار الصناعية... ⏳";
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    status.innerHTML = "✅ تم تحديد موقعك بنجاح في چكليته!";
                    alert("تم الربط بنجاح!");
                }, function(error) {
                    status.innerHTML = "❌ خطأ: يرجى تفعيل الموقع في هاتفك.";
                });
            } else {
                status.innerHTML = "المتصفح لا يدعم الموقع.";
            }
        }
    </script>

</body>
</html>
