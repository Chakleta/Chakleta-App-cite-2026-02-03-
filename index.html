<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چكليته - Chakleta</title>
    <style>
        :root {
            --choco-dark: #3e2723; /* لون الشوكولاتة الغامقة */
            --choco-light: #5d4037;
            --milk-creamy: #fff8e1; /* لون الحليب الكريمي */
            --strawberry-red: #ff4d6d; /* لون الفراولة الزاهي */
            --leaf-green: #2d6a4f; /* لون بذور وعروق الفراولة */
        }

        body {
            background-color: var(--milk-creamy);
            background-image: radial-gradient(circle at 20% 20%, rgba(62, 39, 35, 0.05) 0%, transparent 20%),
                              radial-gradient(circle at 80% 80%, rgba(255, 77, 109, 0.05) 0%, transparent 20%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--choco-dark);
        }

        .welcome-card {
            width: 90%;
            max-width: 400px;
            background: #ffffff;
            border-radius: 40px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(62, 39, 35, 0.15);
            border: 2px solid rgba(62, 39, 35, 0.1);
            position: relative;
            overflow: hidden;
        }

        /* لمسات جمالية (قطع الشوكولاتة والفراولة) */
        .decoration-strawberry {
            font-size: 50px;
            margin-bottom: 10px;
            filter: drop-shadow(0 5px 10px rgba(255, 77, 109, 0.3));
        }

        h1 {
            color: var(--choco-dark);
            font-size: 32px;
            margin: 10px 0;
            letter-spacing: 1px;
        }

        .tagline {
            font-size: 18px;
            line-height: 1.6;
            color: var(--choco-light);
            margin: 20px 0 35px 0;
            padding: 0 10px;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            padding: 18px;
            border: none;
            border-radius: 20px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn-personal {
            background: var(--choco-dark);
            color: var(--milk-creamy);
        }

        .btn-personal:hover {
            background: var(--choco-light);
            transform: translateY(-2px);
        }

        .btn-business {
            background: white;
            color: var(--strawberry-red);
            border: 2px solid var(--strawberry-red);
        }

        .btn-business:hover {
            background: var(--strawberry-red);
            color: white;
            transform: translateY(-2px);
        }

        .gps-section {
            margin-top: 25px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            color: var(--leaf-green);
            cursor: pointer;
        }

        .footer-note {
            margin-top: 30px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <div class="decoration-strawberry">🍓🍫</div>
        
        <h1>چكليته</h1>
        
        <p class="tagline">
            أهلاً بك في <b>چكليته</b>.. <br>
            حيث تجتمع متعة المشاهدة بذكاء التسوق، في منصة صُممت لتكون أقرب إليك.
        </p>

        <div class="btn-container">
            <button class="btn btn-personal">الدخول كحساب شخصي</button>
            <button class="btn btn-business">الدخول كحساب تجاري</button>
        </div>

        <div class="gps-section" onclick="alert('جاري ربط مشروع چكليته بموقعك الحالي...')">
            <span>📍 تفعيل الوصول الذكي (GPS)</span>
        </div>

        <div class="footer-note">
            جميع الحقوق محفوظة لمنصة چكليته 2026
        </div>
    </div>

</body>
</html>
