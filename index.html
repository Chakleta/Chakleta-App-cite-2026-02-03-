
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة چكليته الذكية 🇮🇶</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #fdf5e6; color: #5d4037; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        .flag { font-size: 60px; }
        h1 { color: #d35400; margin-bottom: 5px; }
        .btn { background-color: #27ae60; color: white; border: none; padding: 15px 25px; font-size: 18px; border-radius: 30px; cursor: pointer; margin-top: 20px; transition: 0.3s; width: 100%; }
        .btn:hover { background-color: #219150; transform: scale(1.05); }
        #map { height: 300px; width: 100%; border-radius: 15px; margin-top: 20px; display: none; border: 2px solid #d35400; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="flag">🇮🇶</div>
    <h1>منصة چكليته</h1>
    <p>التسوق الذكي المعتمد على الموقع</p>
    
    <button class="btn" onclick="startChakleta()">تفعيل خريطة چكليته 🛰️</button>
    
    <div id="status">مرحباً بك! اضغط لتحديد موقعك</div>
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    function startChakleta() {
        const status = document.getElementById('status');
        const mapDiv = document.getElementById('map');
        
        status.innerText = "جاري البحث عن موقعك في العراق...";
        
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                
                status.innerHTML = "✅ تم تحديد موقعك! أنت الآن متصل بمنصة چكليته.";
                status.style.color = "#27ae60";
                
                // إظهار الخريطة
                mapDiv.style.display = "block";
                var map = L.map('map').setView([lat, lon], 15);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                L.marker([lat, lon]).addTo(map)
                    .bindPopup('أنت هنا في چكليته 🍫')
                    .openPopup();
                    
            }, function(error) {
                status.innerText = "⚠️ يرجى تفعيل الـ GPS وإعطاء الإذن للمتصفح.";
            });
        } else {
            status.innerText = "متصفحك لا يدعم هذه الخاصية.";
        }
    }
</script>

</body>
</html>
